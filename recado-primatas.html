<style>
/* Layout: uma coluna, imagens grandes empilhadas, pensado para telemóvel */
:root {
  --bg: #16130f; --fg: #f3ede4; --muted: #a39a8c; --accent: #e8a33d; --frame: #2a251e;
  --display: "Bowlby One", Impact, "Arial Black", sans-serif;
  --body: "DM Sans", system-ui, sans-serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-direction: column; gap: 6px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 9vw, 3.2rem); line-height: 1; margin: 0; text-wrap: balance; color: var(--accent); }
header p { margin: 0; color: var(--muted); font-size: 1rem; }
figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
figure img { width: 100%; max-width: 100%; height: auto; display: block; border-radius: 6px; background: var(--frame); }
figcaption { font-size: .8rem; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
footer { text-align: center; color: var(--muted); font-size: .9rem; }
</style>
